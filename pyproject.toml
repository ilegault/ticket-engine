[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-engine"
version = "0.1.0"
description = "Machinery to dispatch and merge tickets overnight via agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
dispatch = "ticket_engine.cli:main"
integrity-gate = "ticket_engine.integrity_runner:main"
work-windows = "ticket_engine.cli:local_worker_main"
box-worker = "ticket_engine.box_worker:main"
add-repo = "ticket_engine.add_repo:main"
engine-gate = "ticket_engine.gate:main"
box-launcher = "ticket_engine.launcher:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["fixtures", ".venv", ".git"]
