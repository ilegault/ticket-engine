[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-engine"
version = "0.1.0"
description = "Machinery to dispatch and merge tickets overnight via agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dispatch = "ticket_engine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
