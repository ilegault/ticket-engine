# engine-repos.toml — engine-level list of target repos.
#
# WHY THIS EXISTS
# ---------------
# ADR 0009: engine-repos.toml is the single repo list and the single on-switch.
# The morning report, the box, and the dispatcher all read it.
# Merging a PR that adds a [[repos]] entry is what turns a repo on.
#
# Format:
# [[repos]]
# repo = "owner/name"
# box = true  # optional, default true. Setting box = false keeps the box away from a repo (ADR 0009).

[[repos]]
repo = "ilegault/slackbot"

[[repos]]
repo = "ilegault/tds-t8"
